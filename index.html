<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>RidePicker</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--green:#16a34a;--red:#dc2626;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8}body{background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;min-height:100vh}.header{background:#0f172a;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.logo{font-size:20px;font-weight:700;color:#38bdf8}.nav{display:flex;border-bottom:1px solid var(--border);background:#0f172a;position:sticky;top:57px;z-index:99}.nav-btn{flex:1;padding:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent}.nav-btn.active{color:#38bdf8;border-bottom-color:#38bdf8}.tab{display:none;padding:16px}.tab.active{display:block}.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;background:#431407;color:#fb923c;border:1px solid #ea580c}.platform-row{display:flex;gap:8px;margin-bottom:16px}.platform-btn{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}.platform-btn.active{border-color:#38bdf8;color:#38bdf8;background:#0c2340}.photo-area{border:2px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;margin-bottom:16px}.photo-area img{max-width:100%;max-height:200px;border-radius:8px;margin-top:12px}.analyze-btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:16px}.analyze-btn:disabled{background:var(--border);color:var(--muted)}.analyze-btn:not(:disabled){background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white}.result-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border)}.verdict{text-align:center;padding:20px;border-radius:12px;margin-bottom:16px;font-size:24px;font-weight:800}.verdict.accept{background:#052e16;border:2px solid var(--green);color:#4ade80}.verdict.decline{background:#2d0a0a;border:2px solid var(--red);color:#f87171}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.cell{background:#0f172a;border-radius:10px;padding:12px}.cell-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase}.cell-val{font-size:18px;font-weight:700}.good{color:#4ade80}.bad{color:#f87171}.ok{color:#fbbf24}.reasons{font-size:13px;color:var(--muted)}.reason{padding:4px 0;border-bottom:1px solid var(--border)}.history-item{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid var(--border)}.history-item.accept{border-left-color:var(--green)}.history-item.decline{border-left-color:var(--red)}.history-header{display:flex;justify-content:space-between;margin-bottom:8px}.history-stats{display:flex;gap:12px;font-size:13px}.settings-section{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}.settings-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}.form-group{margin-bottom:12px}.form-label{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}.form-input{width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}.save-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--muted)}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#fileInput{display:none}</style></head><body><div class="header"><div class="logo">RidePicker</div><div style="background:linear-gradient(135deg,#dc2626,#16a34a);color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600">Cherry Picker</div></div><nav class="nav"><button class="nav-btn active" onclick="showTab('analyze')">Analyze</button><button class="nav-btn" onclick="showTab('history')">History</button><button class="nav-btn" onclick="showTab('settings')">Settings</button></nav><div id="analyze" class="tab active"><div id="apiAlert"></div><div class="platform-row"><button class="platform-btn active" id="btnUber" onclick="setPlatform('uber')">Uber</button><button class="platform-btn" id="btnHopp" onclick="setPlatform('hopp')">Hopp</button></div><div class="photo-area" onclick="document.getElementById('fileInput').click()"><div style="font-size:48px;margin-bottom:8px">&#128247;</div><div style="font-size:16px;font-weight:600;margin-bottom:4px" id="photoLabel">Take Photo of Ride Request</div><div style="font-size:13px;color:var(--muted)">Point at your driver phone screen</div><img id="preview" style="display:none"/></div><input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handlePhoto(this)"/><button class="analyze-btn" id="analyzeBtn" disabled onclick="analyzeRide()">Analyze Ride Request</button><div id="resultArea"></div></div><div id="history" class="tab"><div id="historyList"><p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p></div></div><div id="settings" class="tab"><div class="settings-section"><div class="settings-title">Cherry Picker Filters</div><div class="form-group"><label class="form-label">Min Net Hourly Rate ($/hr)</label><input class="form-input" id="sMinHourly" type="number" value="20"/></div><div class="form-group"><label class="form-label">Min Net Profit Per Trip ($)</label><input class="form-input" id="sMinProfit" type="number" value="10"/></div><div class="form-group"><label class="form-label">Max Pickup Distance (km)</label><input class="form-input" id="sMaxPickup" type="number" value="2"/></div><div class="form-group"><label class="form-label">Min $/km Rate</label><input class="form-input" id="sMinPerKm" type="number" step="0.01" value="0.5"/></div></div><div class="settings-section"><div class="settings-title">Vehicle Costs</div><div class="form-group"><label class="form-label">Cost per km ($)</label><input class="form-input" id="sCostPerKm" type="number" step="0.01" value="0.45"/></div></div><div class="settings-section"><div class="settings-title">OpenAI API Key</div><div class="form-group"><label class="form-label">API Key (stored on this device only)</label><input class="form-input" id="sApiKey" type="password" placeholder="sk-proj-..."/></div></div><button class="save-btn" onclick="saveSettings()">Save Settings</button><div id="saveMsg" style="text-align:center;padding:12px;color:#4ade80;display:none">Settings Saved!</div></div><script>var DK='sk-proj-IbL7cXHJxu8wEXTEumz8RhmEo7eZqVUNqaevK7vOILIHLhMXlbN8I_HxPOFbOHm7h3Z3XA7vVT3BlbkFJqq1UKXjFoRkEtWmVm9UdN_RNGGFMOFYGotJ6dn_nG9DBHD-cPvF2MsXfuWAq9kbIz5cKOZQA';var platform='uber',photoData=null,settings={};function loadSettings(){var s=localStorage.getItem('rpSettings');settings=s?JSON.parse(s):{minHourly:20,minProfit:10,maxPickup:2,minPerKm:0.5,costPerKm:0.45,apiKey:DK};if(!settings.apiKey)settings.apiKey=DK;document.getElementById('sMinHourly').value=settings.minHourly||20;document.getElementById('sMinProfit').value=settings.minProfit||10;document.getElementById('sMaxPickup').value=settings.maxPickup||2;document.getElementById('sMinPerKm').value=settings.minPerKm||0.5;document.getElementById('sCostPerKm').value=settings.costPerKm||0.45;document.getElementById('sApiKey').value=settings.apiKey||DK;updateApiAlert();}function saveSettings(){settings={minHourly:parseFloat(document.getElementById('sMinHourly').value)||20,minProfit:parseFloat(document.getElementById('sMinProfit').value)||10,maxPickup:parseFloat(document.getElementById('sMaxPickup').value)||2,minPerKm:parseFloat(document.getElementById('sMinPerKm').value)||0.5,costPerKm:parseFloat(document.getElementById('sCostPerKm').value)||0.45,apiKey:document.getElementById('sApiKey').value.trim()||DK};localStorage.setItem('rpSettings',JSON.stringify(settings));updateApiAlert();var m=document.getElementById('saveMsg');m.style.display='block';setTimeout(function(){m.style.display='none';},2000);}function updateApiAlert(){var a=document.getElementById('apiAlert');var key=settings.apiKey||DK;if(key&&key.length>10){a.innerHTML='';a.className='';}else{a.innerHTML='<div class="alert">No API key saved. Go to Settings.</div>';}}function showTab(t){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.remove('active');});document.getElementById(t).classList.add('active');document.querySelectorAll('.nav-btn')[['analyze','history','settings'].indexOf(t)].classList.add('active');}function setPlatform(p){platform=p;document.getElementById('btnUber').classList.toggle('active',p==='uber');document.getElementById('btnHopp').classList.toggle('active',p==='hopp');}function handlePhoto(input){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){photoData=e.target.result;var img=document.getElementById('preview');img.src=photoData;img.style.display='block';document.getElementById('photoLabel').textContent='Photo captured - tap to retake';document.getElementById('analyzeBtn').disabled=false;};reader.readAsDataURL(file);}function analyzeRide(){var btn=document.getElementById('analyzeBtn');btn.disabled=true;btn.textContent='Analyzing...';document.getElementById('resultArea').innerHTML='<div class="loading"><div class="spinner"></div> Reading ride details...</div>';var apiKey=settings.apiKey||DK;var isHopp=platform==='hopp';var prompt='You are analyzing a '+(isHopp?'Hopp':'Uber')+' ride request screenshot. Extract values and respond with ONLY valid JSON, no markdown: {"pay": number (shown pay in CAD'+(isHopp?', Hopp includes HST so divide by 1.13 for real pay':'')+'), "pickup_km": number, "pickup_min": number, "trip_km": number, "trip_min": number, "tip": number or 0, "surge": number or 1}';fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'gpt-4o',max_tokens:200,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:photoData,detail:'high'}}]})}).then(function(r){return r.json();}).then(function(data){if(data.error)throw new Error(data.error.message);var text=data.choices[0].message.content.trim().replace(/```json|```/g,'').trim();showResult(JSON.parse(text));}).catch(function(e){document.getElementById('resultArea').innerHTML='<div class="alert">Error: '+e.message+'</div>';}).finally(function(){btn.disabled=false;btn.textContent='Analyze Ride Request';});}function showResult(r){var c=settings.costPerKm||0.45;var totalKm=(r.pickup_km||0)+(r.trip_km||0);var totalMin=(r.pickup_min||0)+(r.trip_min||0);var totalHours=totalMin/60;var vehicleCost=totalKm*c;var netPay=(r.pay||0)-vehicleCost;var hourlyRate=totalHours>0?netPay/totalHours:0;var perKm=(r.trip_km||0)>0?r.pay/(r.trip_km||1):0;var tooFar=(r.pickup_km||0)>(settings.maxPickup||2);var tooSlow=hourlyRate<(settings.minHourly||20);var tooLow=netPay<(settings.minProfit||10);var badPerKm=perKm<(settings.minPerKm||0.5);var accept=!tooFar&&!tooSlow&&!tooLow&&!badPerKm;var reasons=[];if(tooFar)reasons.push('DECLINE: Pickup '+r.pickup_km+'km > max '+settings.maxPickup+'km');if(tooSlow)reasons.push('DECLINE: $'+hourlyRate.toFixed(2)+'/hr < min $'+settings.minHourly+'/hr');if(tooLow)reasons.push('DECLINE: Net $'+netPay.toFixed(2)+' < min $'+settings.minProfit);if(badPerKm)reasons.push('DECLINE: $'+perKm.toFixed(2)+'/km < min $'+settings.minPerKm+'/km');if(accept)reasons.push('All filters passed');document.getElementById('resultArea').innerHTML='<div class="result-card"><div class="verdict '+(accept?'accept':'decline')+'">'+(accept?'ACCEPT':'DECLINE')+'</div><div class="grid"><div class="cell"><div class="cell-label">Net Pay</div><div class="cell-val '+(netPay>=settings.minProfit?'good':'bad')+'">$'+netPay.toFixed(2)+'</div></div><div class="cell"><div class="cell-label">$/Hour</div><div class="cell-val '+(hourlyRate>=settings.minHourly?'good':'bad')+'">$'+hourlyRate.toFixed(2)+'</div></div><div class="cell"><div class="cell-label">Pickup</div><div class="cell-val '+((r.pickup_km||0)<=settings.maxPickup?'good':'bad')+'">'+( r.pickup_km||0)+'km / '+(r.pickup_min||0)+'min</div></div><div class="cell"><div class="cell-label">Trip</div><div class="cell-val ok">'+(r.trip_km||0)+'km / '+(r.trip_min||0)+'min</div></div><div class="cell"><div class="cell-label">Vehicle Cost</div><div class="cell-val bad">-$'+vehicleCost.toFixed(2)+'</div></div><div class="cell"><div class="cell-label">$/km</div><div class="cell-val '+(perKm>=settings.minPerKm?'good':'bad')+'">$'+perKm.toFixed(2)+'</div></div></div><div class="reasons">'+reasons.map(function(x){return '<div class="reason">'+x+'</div>';}).join('')+'</div></div>';saveToHistory({platform:platform,accept:accept,pay:r.pay,netPay:netPay,hourlyRate:hourlyRate,pickup_km:r.pickup_km,trip_km:r.trip_km,time:new Date().toLocaleTimeString()});}function saveToHistory(item){var h=JSON.parse(localStorage.getItem('rpHistory')||'[]');h.unshift(item);localStorage.setItem('rpHistory',JSON.stringify(h.slice(0,50)));renderHistory();}function renderHistory(){var h=JSON.parse(localStorage.getItem('rpHistory')||'[]');var el=document.getElementById('historyList');if(!h.length){el.innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p>';return;}el.innerHTML=h.map(function(x){return '<div class="history-item '+(x.accept?'accept':'decline')+'"><div class="history-header"><span style="font-size:12px;color:var(--muted)">'+(x.platform||'').toUpperCase()+' - '+x.time+'</span><span style="font-size:12px;font-weight:700;color:'+(x.accept?'#4ade80':'#f87171')+'">'+(x.accept?'ACCEPT':'DECLINE')+'</span></div><div class="history-stats"><span>Pay: $'+(x.pay||0).toFixed(2)+'</span><span>Net: $'+(x.netPay||0).toFixed(2)+'</span><span>$/hr: $'+(x.hourlyRate||0).toFixed(2)+'</span></div></div>';}).join('');}loadSettings();renderHistory();</script></body></html>
