<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>RidePicker</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,sans-serif;min-height:100vh}:root{--green:#16a34a;--red:#dc2626;--border:#334155;--card:#1e293b;--muted:#94a3b8}.hdr{background:#0f172a;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.logo{font-size:20px;font-weight:700;color:#38bdf8}.badge{background:linear-gradient(135deg,#dc2626,#16a34a);color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}.nav{display:flex;border-bottom:1px solid var(--border);background:#0f172a;position:sticky;top:57px;z-index:99}.nb{flex:1;padding:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent}.nb.on{color:#38bdf8;border-bottom-color:#38bdf8}.tab{display:none;padding:16px}.tab.on{display:block}.prow{display:flex;gap:8px;margin-bottom:16px}.pb{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-size:16px;font-weight:600;cursor:pointer}.pb.on{border-color:#38bdf8;color:#38bdf8;background:#0c2340}.pzone{border:2px dashed var(--border);border-radius:16px;padding:30px 20px;text-align:center;cursor:pointer;margin-bottom:12px}.pzone img{max-width:100%;max-height:180px;border-radius:8px;margin-top:10px}.spin-wrap{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px;color:var(--muted)}.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:#38bdf8;border-radius:50%;animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border);margin-bottom:12px}.verdict{text-align:center;padding:18px;border-radius:12px;margin-bottom:16px;font-size:26px;font-weight:800}.acc{background:#052e16;border:2px solid var(--green);color:#4ade80}.dec{background:#2d0a0a;border:2px solid var(--red);color:#f87171}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.cell{background:#0f172a;border-radius:10px;padding:12px}.clbl{font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase}.cval{font-size:18px;font-weight:700}.g{color:#4ade80}.r{color:#f87171}.y{color:#fbbf24}.rsn{font-size:13px;color:var(--muted)}.ri{padding:4px 0;border-bottom:1px solid var(--border)}.hi{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid var(--border)}.hi.a{border-left-color:var(--green)}.hi.d{border-left-color:var(--red)}.hh{display:flex;justify-content:space-between;margin-bottom:6px}.hs{display:flex;gap:12px;font-size:13px}.ss{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}.st{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}.fg{margin-bottom:10px}.fl{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}.fi{width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px}.sbtn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.err{padding:12px 16px;border-radius:10px;margin-bottom:14px;font-size:14px;background:#431407;color:#fb923c;border:1px solid #ea580c}#fi{display:none}</style></head><body><div class="hdr"><div class="logo">RidePicker</div><div class="badge">Cherry Picker</div></div><nav class="nav"><button class="nb on" onclick="showTab('a')">Analyze</button><button class="nb" onclick="showTab('h')">History</button><button class="nb" onclick="showTab('s')">Settings</button></nav><div id="a" class="tab on"><div class="prow"><button class="pb on" id="bu" onclick="setPlatform('uber')">Uber</button><button class="pb" id="bh" onclick="setPlatform('hopp')">Hopp</button></div><div class="pzone" onclick="document.getElementById('fi').click()"><div style="font-size:44px;margin-bottom:8px">&#128247;</div><div style="font-size:16px;font-weight:600;margin-bottom:4px" id="pl">Tap to take photo of ride request</div><div style="font-size:13px;color:var(--muted)">Analysis starts automatically</div><img id="pv" style="display:none"/></div><input type="file" id="fi" accept="image/*" capture="environment" onchange="handlePhoto(this)"/><div id="ra"></div></div><div id="h" class="tab"><div id="hl"><p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p></div></div><div id="s" class="tab"><div class="ss"><div class="st">Cherry Picker Filters</div><div class="fg"><label class="fl">Min Net Hourly Rate ($/hr)</label><input class="fi2" id="smh" type="number" value="20" style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div><div class="fg"><label class="fl">Min Net Profit Per Trip ($)</label><input id="smp" type="number" value="10" style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div><div class="fg"><label class="fl">Max Pickup Distance (km)</label><input id="smx" type="number" value="2" style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div><div class="fg"><label class="fl">Min $/km Rate</label><input id="skm" type="number" step="0.01" value="0.5" style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div></div><div class="ss"><div class="st">Vehicle Costs</div><div class="fg"><label class="fl">Cost per km ($)</label><input id="sck" type="number" step="0.01" value="0.45" style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div></div><div class="ss"><div class="st">OpenAI API Key</div><div class="fg"><label class="fl">API Key</label><input id="sak" type="password" placeholder="sk-proj-..." style="width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:14px"/></div></div><button class="sbtn" onclick="saveS()">Save Settings</button><div id="sm" style="text-align:center;padding:10px;color:#4ade80;display:none">Saved!</div></div><script>var DK='sk-proj-IbL7cXHJxu8wEXTEumz8RhmEo7eZqVUNqaevK7vOILIHLhMXlbN8I_HxPOFbOHm7h3Z3XA7vVT3BlbkFJqq1UKXjFoRkEtWmVm9UdN_RNGGFMOFYGotJ6dn_nG9DBHD-cPvF2MsXfuWAq9kbIz5cKOZQA';var plat='uber',imgData=null,cfg={};function loadS(){var raw=localStorage.getItem('rp2');cfg=raw?JSON.parse(raw):{mh:20,mp:10,mx:2,mk:0.5,ck:0.45,ak:DK};if(!cfg.ak)cfg.ak=DK;document.getElementById('smh').value=cfg.mh||20;document.getElementById('smp').value=cfg.mp||10;document.getElementById('smx').value=cfg.mx||2;document.getElementById('skm').value=cfg.mk||0.5;document.getElementById('sck').value=cfg.ck||0.45;document.getElementById('sak').value=cfg.ak||DK;}function saveS(){cfg={mh:parseFloat(document.getElementById('smh').value)||20,mp:parseFloat(document.getElementById('smp').value)||10,mx:parseFloat(document.getElementById('smx').value)||2,mk:parseFloat(document.getElementById('skm').value)||0.5,ck:parseFloat(document.getElementById('sck').value)||0.45,ak:document.getElementById('sak').value.trim()||DK};localStorage.setItem('rp2',JSON.stringify(cfg));var m=document.getElementById('sm');m.style.display='block';setTimeout(function(){m.style.display='none';},2000);}function showTab(t){['a','h','s'].forEach(function(x){document.getElementById(x).classList.remove('on');});document.querySelectorAll('.nb').forEach(function(x){x.classList.remove('on');});document.getElementById(t).classList.add('on');document.querySelectorAll('.nb')[['a','h','s'].indexOf(t)].classList.add('on');}function setPlatform(p){plat=p;document.getElementById('bu').classList.toggle('on',p==='uber');document.getElementById('bh').classList.toggle('on',p==='hopp');}function handlePhoto(inp){var file=inp.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(e){imgData=e.target.result;document.getElementById('pv').src=imgData;document.getElementById('pv').style.display='block';document.getElementById('pl').textContent='Photo taken - analyzing...';doAnalyze();};rd.readAsDataURL(file);}function doAnalyze(){document.getElementById('ra').innerHTML='<div class="spin-wrap"><div class="spin"></div> Sending to AI...</div>';var key=cfg.ak||DK;var isH=plat==='hopp';var msg='Analyze this '+(isH?'Hopp':'Uber')+' driver ride request screenshot. Return ONLY a JSON object with these fields: pay (number, the fare shown in CAD'+(isH?'; Hopp pay includes HST so real pay = shown amount divided by 1.13':'')+'), pickup_km (pickup distance in km), pickup_min (pickup time in minutes), trip_km (trip distance in km), trip_min (trip duration in minutes). No explanation, just JSON.';var body=JSON.stringify({model:'gpt-4o',max_tokens:150,messages:[{role:'user',content:[{type:'text',text:msg},{type:'image_url',image_url:{url:imgData,detail:'high'}}]}]});fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:body}).then(function(res){return res.json();}).then(function(d){if(d.error){throw new Error(d.error.message);}var txt=d.choices[0].message.content.trim();txt=txt.replace(/```json|```/g,'').trim();var r=JSON.parse(txt);showResult(r);document.getElementById('pl').textContent='Tap to take another photo';}).catch(function(e){document.getElementById('ra').innerHTML='<div class="err">Error: '+e.message+'</div>';document.getElementById('pl').textContent='Tap to retake photo';});}function showResult(r){var ck=cfg.ck||0.45;var tkm=(r.pickup_km||0)+(r.trip_km||0);var tmin=(r.pickup_min||0)+(r.trip_min||0);var thr=tmin/60;var vcost=tkm*ck;var net=(r.pay||0)-vcost;var hr=thr>0?net/thr:0;var pkm=(r.trip_km||0)>0?r.pay/(r.trip_km||1):0;var far=(r.pickup_km||0)>(cfg.mx||2);var slow=hr<(cfg.mh||20);var low=net<(cfg.mp||10);var badkm=pkm<(cfg.mk||0.5);var ok=!far&&!slow&&!low&&!badkm;var rsns=[];if(far)rsns.push('Pickup too far: '+r.pickup_km+'km (max '+cfg.mx+'km)');if(slow)rsns.push('Too slow: $'+hr.toFixed(2)+'/hr (min $'+cfg.mh+'/hr)');if(low)rsns.push('Pay too low: net $'+net.toFixed(2)+' (min $'+cfg.mp+')');if(badkm)rsns.push('Bad rate: $'+pkm.toFixed(2)+'/km (min $'+cfg.mk+'/km)');if(ok)rsns.push('All filters passed!');document.getElementById('ra').innerHTML='<div class="card"><div class="verdict '+(ok?'acc':'dec')+'">'+(ok?'ACCEPT':'DECLINE')+'</div><div class="grid"><div class="cell"><div class="clbl">Net Pay</div><div class="cval '+(net>=(cfg.mp||10)?'g':'r')+'">$'+net.toFixed(2)+'</div></div><div class="cell"><div class="clbl">$/Hour</div><div class="cval '+(hr>=(cfg.mh||20)?'g':'r')+'">$'+hr.toFixed(2)+'</div></div><div class="cell"><div class="clbl">Pickup</div><div class="cval '+((r.pickup_km||0)<=(cfg.mx||2)?'g':'r')+'">'+( r.pickup_km||0)+'km / '+(r.pickup_min||0)+'min</div></div><div class="cell"><div class="clbl">Trip</div><div class="cval y">'+(r.trip_km||0)+'km / '+(r.trip_min||0)+'min</div></div><div class="cell"><div class="clbl">Vehicle Cost</div><div class="cval r">-$'+vcost.toFixed(2)+'</div></div><div class="cell"><div class="clbl">$/km</div><div class="cval '+(pkm>=(cfg.mk||0.5)?'g':'r')+'">$'+pkm.toFixed(2)+'</div></div></div><div class="rsn">'+rsns.map(function(x){return '<div class="ri">'+x+'</div>';}).join('')+'</div></div>';addHist({plat:plat,ok:ok,pay:r.pay,net:net,hr:hr,pkm:r.pickup_km,tkm:r.trip_km,t:new Date().toLocaleTimeString()});}function addHist(item){var h=JSON.parse(localStorage.getItem('rph')||'[]');h.unshift(item);localStorage.setItem('rph',JSON.stringify(h.slice(0,50)));renderHist();}function renderHist(){var h=JSON.parse(localStorage.getItem('rph')||'[]');var el=document.getElementById('hl');if(!h.length){el.innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p>';return;}el.innerHTML=h.map(function(x){return '<div class="hi '+(x.ok?'a':'d')+'"><div class="hh"><span style="font-size:12px;color:var(--muted)">'+(x.plat||'').toUpperCase()+' - '+x.t+'</span><span style="font-size:12px;font-weight:700;color:'+(x.ok?'#4ade80':'#f87171')+'">'+(x.ok?'ACCEPT':'DECLINE')+'</span></div><div class="hs"><span>Pay:$'+(x.pay||0).toFixed(2)+'</span><span>Net:$'+(x.net||0).toFixed(2)+'</span><span>$/hr:$'+(x.hr||0).toFixed(2)+'</span><span>Pickup:'+(x.pkm||0)+'km</span></div></div>';}).join('');}loadS();renderHist();</script></body></html>
