<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><title>RidePicker</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--green:#16a34a;--red:#dc2626;--yellow:#d97706;--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--muted:#94a3b8}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}.header{background:#0f172a;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}.logo{font-size:20px;font-weight:700;color:#38bdf8;display:flex;align-items:center;gap:8px}.cherry-badge{background:linear-gradient(135deg,#dc2626,#16a34a);color:white;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}.nav{display:flex;border-bottom:1px solid var(--border);background:#0f172a;position:sticky;top:57px;z-index:99}.nav-btn{flex:1;padding:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}.nav-btn.active{color:#38bdf8;border-bottom-color:#38bdf8}.tab{display:none;padding:16px}.tab.active{display:block}.alert{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;font-weight:500}.alert-warn{background:#431407;color:#fb923c;border:1px solid #ea580c}.alert-ok{background:#052e16;color:#4ade80;border:1px solid #16a34a}.platform-row{display:flex;gap:8px;margin-bottom:16px}.platform-btn{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--muted);font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s}.platform-btn.active{border-color:#38bdf8;color:#38bdf8;background:#0c2340}.photo-area{border:2px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:16px;position:relative;overflow:hidden}.photo-area:active{background:var(--card)}.photo-area img{max-width:100%;max-height:200px;border-radius:8px;margin-top:12px}.photo-icon{font-size:48px;margin-bottom:8px}.photo-label{font-size:16px;font-weight:600;margin-bottom:4px}.photo-sub{font-size:13px;color:var(--muted)}.analyze-btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:16px}.analyze-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}.analyze-btn:not(:disabled){background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white}.result-card{background:var(--card);border-radius:16px;padding:20px;border:2px solid var(--border)}.result-verdict{text-align:center;padding:20px;border-radius:12px;margin-bottom:16px;font-size:24px;font-weight:800}.verdict-accept{background:#052e16;border:2px solid var(--green);color:#4ade80}.verdict-decline{background:#2d0a0a;border:2px solid var(--red);color:#f87171}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.result-item{background:#0f172a;border-radius:10px;padding:12px}.result-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}.result-value{font-size:18px;font-weight:700}.result-value.good{color:#4ade80}.result-value.bad{color:#f87171}.result-value.ok{color:#fbbf24}.reasons{font-size:13px;color:var(--muted)}.reason-item{padding:4px 0;border-bottom:1px solid var(--border)}.reason-item:last-child{border:none}.history-item{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid var(--border)}.history-item.accept{border-left-color:var(--green)}.history-item.decline{border-left-color:var(--red)}.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.history-platform{font-size:12px;font-weight:600;color:var(--muted)}.history-verdict{font-size:12px;font-weight:700}.history-stats{display:flex;gap:16px;font-size:13px}.settings-section{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px}.settings-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}.form-group{margin-bottom:12px}.form-label{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}.form-input{width:100%;padding:10px 12px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}.save-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--muted)}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:#38bdf8;border-radius:50%;animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#fileInput{display:none}</style></head><body><div class="header"><div class="logo">🍒 RidePicker</div><div class="cherry-badge">Cherry Picker</div></div><nav class="nav"><button class="nav-btn active" onclick="showTab('analyze')">📷 Analyze</button><button class="nav-btn" onclick="showTab('history')">📋 History</button><button class="nav-btn" onclick="showTab('settings')">⚙️ Settings</button></nav><div id="analyze" class="tab active"><div id="apiAlert"></div><div class="platform-row"><button class="platform-btn active" id="btnUber" onclick="setPlatform('uber')">🚗 Uber</button><button class="platform-btn" id="btnHopp" onclick="setPlatform('hopp')">🟢 Hopp</button></div><div class="photo-area" onclick="document.getElementById('fileInput').click()"><div class="photo-icon">📷</div><div class="photo-label">Take Photo of Ride Request</div><div class="photo-sub">Point at your driver phone screen</div><img id="preview" style="display:none"/></div><input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handlePhoto(this)"/><button class="analyze-btn" id="analyzeBtn" disabled onclick="analyzeRide()">Analyze Ride Request</button><div id="resultArea"></div></div><div id="history" class="tab"><div id="historyList"><p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p></div></div><div id="settings" class="tab"><div class="settings-section"><div class="settings-title">🍒 Cherry Picker Filters</div><div class="form-group"><label class="form-label">Min Net Hourly Rate ($/hr)<br><small>Trips below this = DECLINE</small></label><input class="form-input" id="sMinHourly" type="number" value="20"/></div><div class="form-group"><label class="form-label">Min Net Profit Per Trip ($)</label><input class="form-input" id="sMinProfit" type="number" value="10"/></div><div class="form-group"><label class="form-label">Max Pickup Distance (km)</label><input class="form-input" id="sMaxPickup" type="number" value="2"/></div><div class="form-group"><label class="form-label">Min $/km Rate</label><input class="form-input" id="sMinPerKm" type="number" step="0.01" value="0.5"/></div></div><div class="settings-section"><div class="settings-title">🚗 Vehicle Costs</div><div class="form-group"><label class="form-label">Cost per km ($)<br><small>Fuel + maintenance + depreciation</small></label><input class="form-input" id="sCostPerKm" type="number" step="0.01" value="0.45"/></div></div><div class="settings-section"><div class="settings-title">🔑 OpenAI API Key</div><div class="form-group"><label class="form-label">API Key<br><small>Stored on this device only. Never shared.</small></label><input class="form-input" id="sApiKey" type="password" placeholder="sk-proj-..."/></div></div><button class="save-btn" onclick="saveSettings()">Save Settings</button><div id="saveMsg" style="text-align:center;padding:12px;color:#4ade80;display:none">Settings Saved!</div></div><script>const DEFAULT_KEY='sk-proj-IbL7cXHJxu8wEXTEumz8RhmEo7eZqVUNqaevK7vOILIHLhMXlbN8I_HxPOFbOHm7h3Z3XA7vVT3BlbkFJqq1UKXjFoRkEtWmVm9UdN_RNGGFMOFYGotJ6dn_nG9DBHD-cPvF2MsXfuWAq9kbIz5cKOZQA';let platform='uber',photoData=null,settings={};function loadSettings(){const s=localStorage.getItem('rpSettings');settings=s?JSON.parse(s):{minHourly:20,minProfit:10,maxPickup:2,minPerKm:0.5,costPerKm:0.45,apiKey:DEFAULT_KEY};if(!settings.apiKey)settings.apiKey=DEFAULT_KEY;document.getElementById('sMinHourly').value=settings.minHourly||20;document.getElementById('sMinProfit').value=settings.minProfit||10;document.getElementById('sMaxPickup').value=settings.maxPickup||2;document.getElementById('sMinPerKm').value=settings.minPerKm||0.5;document.getElementById('sCostPerKm').value=settings.costPerKm||0.45;document.getElementById('sApiKey').value=settings.apiKey||DEFAULT_KEY;updateApiAlert();}function saveSettings(){settings={minHourly:parseFloat(document.getElementById('sMinHourly').value)||20,minProfit:parseFloat(document.getElementById('sMinProfit').value)||10,maxPickup:parseFloat(document.getElementById('sMaxPickup').value)||2,minPerKm:parseFloat(document.getElementById('sMinPerKm').value)||0.5,costPerKm:parseFloat(document.getElementById('sCostPerKm').value)||0.45,apiKey:document.getElementById('sApiKey').value.trim()||DEFAULT_KEY};localStorage.setItem('rpSettings',JSON.stringify(settings));updateApiAlert();const m=document.getElementById('saveMsg');m.style.display='block';setTimeout(()=>m.style.display='none',2000);}function updateApiAlert(){const a=document.getElementById('apiAlert');const key=settings.apiKey||DEFAULT_KEY;if(key&&key.length>10){a.innerHTML='';a.className='';}else{a.innerHTML='<div class="alert alert-warn">⚠️ No API key saved. Go to Settings first.</div>';}}function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav-btn')[['analyze','history','settings'].indexOf(t)].classList.add('active');}function setPlatform(p){platform=p;document.getElementById('btnUber').classList.toggle('active',p==='uber');document.getElementById('btnHopp').classList.toggle('active',p==='hopp');}function handlePhoto(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{photoData=e.target.result;const img=document.getElementById('preview');img.src=photoData;img.style.display='block';document.querySelector('.photo-icon').style.display='none';document.querySelector('.photo-label').textContent='Photo captured';document.querySelector('.photo-sub').textContent='Tap to retake';document.getElementById('analyzeBtn').disabled=false;};reader.readAsDataURL(file);}async function analyzeRide(){const btn=document.getElementById('analyzeBtn');btn.disabled=true;btn.textContent='Analyzing...';document.getElementById('resultArea').innerHTML='<div class="loading"><div class="spinner"></div> Reading ride details with AI...</div>';const apiKey=settings.apiKey||DEFAULT_KEY;const isHopp=platform==='hopp';const prompt=`You are analyzing a ${isHopp?'Hopp':'Uber'} ride request screenshot from a driver's phone.Extract these values and respond with ONLY valid JSON, no markdown:
{
  "pay": <number - shown pay amount in CAD${isHopp?' - NOTE: Hopp pay INCLUDES HST, so strip 13% HST: real_pay = pay/1.13':''}>,
  "pickup_km": <number - pickup/deadhead distance in km>,
  "pickup_min": <number - pickup time in minutes>,
  "trip_km": <number - trip distance in km>,
  "trip_min": <number - trip duration in minutes>,
  "tip": <number - tip amount if shown, else 0>,
  "surge": <number - surge multiplier if shown, else 1>
}`;try{const response=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'gpt-4o',max_tokens:300,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:photoData,detail:'high'}}]}]})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'API error');let text=data.choices[0].message.content.trim();text=text.replace(/```json|```/g,'').trim();const r=JSON.parse(text);showResult(r);}catch(e){document.getElementById('resultArea').innerHTML=`<div class="alert alert-warn">Error: ${e.message}</div>`;btn.disabled=false;btn.textContent='Analyze Ride Request';}btn.disabled=false;btn.textContent='Analyze Ride Request';}function showResult(r){const c=settings.costPerKm||0.45;const totalKm=(r.pickup_km||0)+(r.trip_km||0);const totalMin=(r.pickup_min||0)+(r.trip_min||0);const totalHours=totalMin/60;const vehicleCost=totalKm*c;const netPay=(r.pay||0)-(vehicleCost);const hourlyRate=totalHours>0?netPay/totalHours:0;const perKm=(r.trip_km||0)>0?r.pay/(r.trip_km||1):0;const tooFar=(r.pickup_km||0)>(settings.maxPickup||2);const tooSlow=hourlyRate<(settings.minHourly||20);const tooLow=netPay<(settings.minProfit||10);const badPerKm=perKm<(settings.minPerKm||0.5);const accept=!tooFar&&!tooSlow&&!tooLow&&!badPerKm;const reasons=[];if(tooFar)reasons.push(`❌ Pickup ${r.pickup_km}km > max ${settings.maxPickup}km`);if(tooSlow)reasons.push(`❌ $${hourlyRate.toFixed(2)}/hr < min $${settings.minHourly}/hr`);if(tooLow)reasons.push(`❌ Net $${netPay.toFixed(2)} < min $${settings.minProfit}`);if(badPerKm)reasons.push(`❌ $${perKm.toFixed(2)}/km < min $${settings.minPerKm}/km`);if(accept)reasons.push('✅ All filters passed');const html=`<div class="result-card"><div class="result-verdict ${accept?'verdict-accept':'verdict-decline'}">${accept?'✅ ACCEPT':'❌ DECLINE'}</div><div class="result-grid"><div class="result-item"><div class="result-label">Net Pay</div><div class="result-value ${netPay>=settings.minProfit?'good':'bad'}">$${netPay.toFixed(2)}</div></div><div class="result-item"><div class="result-label">$/Hour</div><div class="result-value ${hourlyRate>=settings.minHourly?'good':'bad'}">$${hourlyRate.toFixed(2)}</div></div><div class="result-item"><div class="result-label">Pickup</div><div class="result-value ${(r.pickup_km||0)<=settings.maxPickup?'good':'bad'}">${r.pickup_km||0}km / ${r.pickup_min||0}min</div></div><div class="result-item"><div class="result-label">Trip</div><div class="result-value ok">${r.trip_km||0}km / ${r.trip_min||0}min</div></div><div class="result-item"><div class="result-label">Vehicle Cost</div><div class="result-value bad">-$${vehicleCost.toFixed(2)}</div></div><div class="result-item"><div class="result-label">$/km</div><div class="result-value ${perKm>=settings.minPerKm?'good':'bad'}">$${perKm.toFixed(2)}</div></div></div><div class="reasons">${reasons.map(x=>`<div class="reason-item">${x}</div>`).join('')}</div></div>`;document.getElementById('resultArea').innerHTML=html;saveHistory({platform,accept,pay:r.pay,netPay,hourlyRate,pickup_km:r.pickup_km,trip_km:r.trip_km,time:new Date().toLocaleTimeString()});}function saveHistory(item){const h=JSON.parse(localStorage.getItem('rpHistory')||'[]');h.unshift(item);localStorage.setItem('rpHistory',JSON.stringify(h.slice(0,50)));renderHistory();}function renderHistory(){const h=JSON.parse(localStorage.getItem('rpHistory')||'[]');const el=document.getElementById('historyList');if(!h.length){el.innerHTML='<p style="color:var(--muted);text-align:center;padding:40px">No rides analyzed yet</p>';return;}el.innerHTML=h.map(x=>`<div class="history-item ${x.accept?'accept':'decline'}"><div class="history-header"><span class="history-platform">${x.platform?.toUpperCase()} · ${x.time}</span><span class="history-verdict" style="color:${x.accept?'#4ade80':'#f87171'}">${x.accept?'ACCEPT':'DECLINE'}</span></div><div class="history-stats"><span>Pay: $${(x.pay||0).toFixed(2)}</span><span>Net: $${(x.netPay||0).toFixed(2)}</span><span>$/hr: $${(x.hourlyRate||0).toFixed(2)}</span><span>Pickup: ${x.pickup_km||0}km</span></div></div>`).join('');}loadSettings();renderHistory();</script></body></html>
